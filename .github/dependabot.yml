version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rubocop:
        patterns:
          - "rubocop*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
