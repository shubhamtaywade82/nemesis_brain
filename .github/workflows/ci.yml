name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rspec --format progress

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --format github

  boot-smoke:
    name: Boot smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # boot_nemesis.rb runs forever until interrupted, so it's wrapped in
      # `timeout` — exit code 124 (killed by timeout) means it booted and
      # stayed up; anything else means it crashed or never printed the
      # startup banner. See AGENTS.md for the same convention used locally.
      - name: Boot QuantDesk in paper mode and confirm it stays up
        env:
          QUANTDESK_PAPER_MODE: "true"
          QUANTDESK_LLM_ENABLED: "false"
        run: |
          set +e
          timeout 10 ruby boot_nemesis.rb
          code=$?
          set -e
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "::error::boot_nemesis.rb exited with unexpected code $code"
            exit 1
          fi
          echo "Boot smoke test passed (exit code $code)"
